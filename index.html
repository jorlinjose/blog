<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shatterOcalm | Jorlin's Blog</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f7f5f0;
            --surface-color: #ffffff;
            --heading-color: #1a365d;
            --text-main: #4a5568;
            --text-muted: #718096;
            --accent-color: #9b2c2c;
            --border-color: #e2e8f0;
            --spotify-green: #1DB954;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 0 16px;
        }

        .site-header {
            text-align: center;
            padding: 20px 0 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .site-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem; /* reduced size */
            margin-bottom: 10px;
        }

        .category-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .category-nav a {
            color: var(--text-muted);
            font-weight: 600;
        }

        .category-nav a:hover {
            color: var(--accent-color);
        }

        .category-section {
            margin-bottom: 40px; /* reduced spacing */
        }

        .section-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .article-card {
            background: var(--surface-color);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .article-card:hover {
            transform: translateY(-2px);
        }

        .article-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            margin: 5px 0;
        }

        .article-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .article-excerpt {
            font-size: 0.95rem;
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .playlist-card {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .playlist-card i {
            color: var(--spotify-green);
        }

        .site-footer {
            text-align: center;
            padding: 30px 0;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="container">
        <h1 class="site-title">shatterOcalm</h1>
        <nav class="category-nav">
            <a href="#poetry">Poetry</a>
            <a href="#fiction">Fiction</a>
            <a href="#playlists">Playlists</a>
        </nav>
    </div>
</header>

<main class="container">

<section id="fiction" class="category-section">
    <h2 class="section-header">Fiction</h2>

    <div class="article-card">
        <div class="article-date">March 14, 2026</div>
        <div class="article-title">The Parallax Protocol</div>
        <div class="article-excerpt">The light of the Aethelgard System was not yellow...</div>
    </div>
</section>

<section id="poetry" class="category-section">
    <h2 class="section-header">Poetry</h2>

    <div class="article-card">
        <div class="article-date">October 13, 2023</div>
        <div class="article-title">Untimely Winter</div>
    </div>

    <div class="article-card">
        <div class="article-date">September 30, 2023</div>
        <div class="article-title">A Haunting Melody</div>
    </div>
</section>

<section id="playlists" class="category-section">
    <h2 class="section-header">Playlists</h2>

    <div class="playlist-grid">
        <div class="playlist-card"><i class="fab fa-spotify"></i> Lag Ja Gale</div>
        <div class="playlist-card"><i class="fab fa-spotify"></i> 2000s Mix</div>
        <div class="playlist-card"><i class="fab fa-spotify"></i> tharattu</div>
    </div>
</section>

</main>

<footer class="site-footer">
    © 2026 Jorlin
</footer>

</body>
</html>
